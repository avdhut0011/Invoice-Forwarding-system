<!DOCTYPE html>
<html lang="en" class="h-full bg-slate-900">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In — Ashoka Education Foundation FMS</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="h-full flex items-center justify-center p-4">
    <div class="max-w-md w-full bg-slate-800 border border-slate-700 rounded-3xl p-8 shadow-2xl">
        <div class="text-center mb-6">
            <div class="inline-flex w-14 h-14 rounded-2xl bg-teal-600 items-center justify-center text-white font-extrabold text-2xl mb-3 shadow-lg">
                FMS
            </div>
            <h1 class="text-2xl font-bold text-white tracking-tight">Invoice Forwarding System</h1>
            <p class="text-slate-400 text-xs mt-1">Ashoka Education Foundation</p>
        </div>

        {% if form.errors %}
        <div class="p-3 mb-4 rounded-xl bg-red-950/80 border border-red-800 text-red-200 text-xs">
            Invalid username or password. Please try again.
        </div>
        {% endif %}

        <form method="post" action="{% url 'portal:login' %}" class="space-y-4">
            {% csrf_token %}
            <div>
                <label class="block text-xs font-semibold text-slate-300 uppercase tracking-wider mb-1">Username</label>
                <input type="text" name="username" id="usernameField" required class="w-full bg-slate-900 border border-slate-700 text-white rounded-xl px-4 py-2.5 text-sm focus:ring-2 focus:ring-teal-500 outline-none transition" placeholder="e.g. chandrashekhar, vishal, accounts">
            </div>
            <div>
                <label class="block text-xs font-semibold text-slate-300 uppercase tracking-wider mb-1">Password</label>
                <input type="password" name="password" id="passwordField" required class="w-full bg-slate-900 border border-slate-700 text-white rounded-xl px-4 py-2.5 text-sm focus:ring-2 focus:ring-teal-500 outline-none transition" placeholder="••••••••">
            </div>
            <button type="submit" class="w-full bg-teal-600 hover:bg-teal-500 text-white font-bold py-3 rounded-xl transition shadow-lg text-sm">
                Sign In to Portal
            </button>
        </form>

        <!-- Quick 1-Click Role Login Helpers for pair programming & testing -->
        <div class="mt-8 pt-6 border-t border-slate-700/60">
            <div class="text-xs text-slate-400 font-semibold mb-3 text-center">1-Click Test Credentials (password123):</div>
            <div class="grid grid-cols-2 gap-2 text-xs">
                <button type="button" onclick="fillCreds('chandrashekhar')" class="bg-slate-700/50 hover:bg-slate-700 text-slate-200 py-1.5 px-3 rounded-lg border border-slate-600 text-left transition">
                    📦 <strong>Store</strong> (chandrashekhar)
                </button>
                <button type="button" onclick="fillCreds('vishal')" class="bg-slate-700/50 hover:bg-slate-700 text-slate-200 py-1.5 px-3 rounded-lg border border-slate-600 text-left transition">
                    🛒 <strong>Purchase</strong> (vishal)
                </button>
                <button type="button" onclick="fillCreds('accounts')" class="bg-slate-700/50 hover:bg-slate-700 text-slate-200 py-1.5 px-3 rounded-lg border border-slate-600 text-left transition">
                    📑 <strong>Accounts</strong> (accounts)
                </button>
                <button type="button" onclick="fillCreds('admin')" class="bg-slate-700/50 hover:bg-slate-700 text-slate-200 py-1.5 px-3 rounded-lg border border-slate-600 text-left transition">
                    ⚙️ <strong>Admin</strong> (admin)
                </button>
            </div>
        </div>
    </div>

    <script>
        function fillCreds(user) {
            document.getElementById('usernameField').value = user;
            document.getElementById('passwordField').value = 'password123';
        }
    </script>
</body>
</html>
