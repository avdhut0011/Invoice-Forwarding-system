<!DOCTYPE html>
<html lang="en" class="h-full bg-[#f8f9fc]">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In — Ashoka Education Foundation FMS</title>
    <!-- Google Fonts & Material Symbols -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Roboto', 'sans-serif'],
                    },
                    colors: {
                        md: {
                            primary: '#00629e',
                            'primary-container': '#d0e4ff',
                            'on-primary-container': '#001d36',
                            surface: '#f8f9fc',
                            'surface-container-lowest': '#ffffff',
                            'surface-container': '#eceef2',
                            'surface-container-high': '#e6e8ec',
                            'on-surface': '#191c20',
                            'on-surface-variant': '#43474e',
                            outline: '#73777f',
                            'outline-variant': '#c3c6cf',
                            error: '#ba1a1a',
                            'error-container': '#ffdad6',
                        }
                    },
                    boxShadow: {
                        'm3-1': '0px 1px 3px 1px rgba(0, 0, 0, 0.15), 0px 1px 2px 0px rgba(0, 0, 0, 0.30)',
                        'm3-3': '0px 4px 8px 3px rgba(0, 0, 0, 0.15), 0px 1px 3px 0px rgba(0, 0, 0, 0.30)',
                    }
                }
            }
        }
    </script>
</head>
<body class="h-full flex items-center justify-center p-4 bg-md-surface text-md-on-surface">
    <div class="max-w-md w-full bg-md-surface-container-lowest border border-md-outline-variant/60 rounded-3xl p-8 shadow-m3-3 transition-all">
        <!-- Brand Header -->
        <div class="text-center mb-8">
            <div class="inline-flex w-16 h-16 rounded-3xl bg-md-primary items-center justify-center text-white mb-3 shadow-m3-1">
                <span class="material-symbols-outlined text-3xl">description</span>
            </div>
            <h1 class="text-2xl font-bold tracking-tight text-md-on-surface">Ashoka FMS</h1>
            <p class="text-xs text-md-on-surface-variant mt-1 font-medium">Invoice Forwarding &amp; Custody Portal</p>
        </div>

        {% if form.errors %}
        <div class="p-3.5 mb-5 rounded-2xl bg-md-error-container text-md-error text-xs font-medium border border-rose-200 flex items-center gap-2">
            <span class="material-symbols-outlined text-lg">error</span>
            <span>Invalid username or password. Please try again.</span>
        </div>
        {% endif %}

        <form method="post" action="{% url 'portal:login' %}" class="space-y-5">
            {% csrf_token %}
            
            <!-- Username Field -->
            <div>
                <label class="block text-xs font-bold text-md-on-surface-variant uppercase tracking-wider mb-1.5 flex items-center gap-1.5">
                    <span class="material-symbols-outlined text-[16px] text-md-primary">person</span>
                    <span>Username</span>
                </label>
                <input type="text" name="username" id="usernameField" required 
                       class="w-full bg-md-surface border border-md-outline-variant rounded-2xl px-4 py-3 text-sm text-md-on-surface focus:border-md-primary focus:ring-2 focus:ring-md-primary/20 outline-none transition" 
                       placeholder="Enter your username">
            </div>

            <!-- Password Field -->
            <div>
                <label class="block text-xs font-bold text-md-on-surface-variant uppercase tracking-wider mb-1.5 flex items-center gap-1.5">
                    <span class="material-symbols-outlined text-[16px] text-md-primary">lock</span>
                    <span>Password</span>
                </label>
                <input type="password" name="password" id="passwordField" required 
                       class="w-full bg-md-surface border border-md-outline-variant rounded-2xl px-4 py-3 text-sm text-md-on-surface focus:border-md-primary focus:ring-2 focus:ring-md-primary/20 outline-none transition" 
                       placeholder="••••••••">
            </div>

            <!-- Material Filled Button -->
            <button type="submit" class="w-full bg-md-primary hover:bg-[#004f80] text-white font-bold py-3.5 px-6 rounded-full shadow-m3-1 hover:shadow-m3-3 transition-all text-sm flex items-center justify-center gap-2">
                <span>Sign In to Workspace</span>
                <span class="material-symbols-outlined text-[18px]">arrow_forward</span>
            </button>
        </form>

        <!-- Material Chips: Quick Login Helpers -->
        <div class="mt-8 pt-6 border-t border-md-outline-variant/40">
            <div class="text-[11px] font-bold text-md-on-surface-variant uppercase tracking-wider mb-3 text-center">
                1-Click Quick Select (password123):
            </div>
            <div class="grid grid-cols-2 gap-2 text-xs">
                <button type="button" onclick="fillCreds('chandrashekhar')" class="flex items-center gap-2 bg-md-surface-container hover:bg-md-surface-container-high text-md-on-surface p-2.5 rounded-2xl border border-md-outline-variant/40 transition text-left">
                    <span class="material-symbols-outlined text-md-primary text-[18px]">inventory_2</span>
                    <div>
                        <div class="font-bold leading-tight">Store</div>
                        <div class="text-[10px] text-md-on-surface-variant truncate">chandrashekhar</div>
                    </div>
                </button>
                <button type="button" onclick="fillCreds('vishal')" class="flex items-center gap-2 bg-md-surface-container hover:bg-md-surface-container-high text-md-on-surface p-2.5 rounded-2xl border border-md-outline-variant/40 transition text-left">
                    <span class="material-symbols-outlined text-md-primary text-[18px]">shopping_cart</span>
                    <div>
                        <div class="font-bold leading-tight">Purchase</div>
                        <div class="text-[10px] text-md-on-surface-variant truncate">vishal</div>
                    </div>
                </button>
                <button type="button" onclick="fillCreds('accounts')" class="flex items-center gap-2 bg-md-surface-container hover:bg-md-surface-container-high text-md-on-surface p-2.5 rounded-2xl border border-md-outline-variant/40 transition text-left">
                    <span class="material-symbols-outlined text-md-primary text-[18px]">account_balance_wallet</span>
                    <div>
                        <div class="font-bold leading-tight">Accounts</div>
                        <div class="text-[10px] text-md-on-surface-variant truncate">accounts</div>
                    </div>
                </button>
                <button type="button" onclick="fillCreds('manager')" class="flex items-center gap-2 bg-md-surface-container hover:bg-md-surface-container-high text-md-on-surface p-2.5 rounded-2xl border border-md-outline-variant/40 transition text-left">
                    <span class="material-symbols-outlined text-md-primary text-[18px]">shield_person</span>
                    <div>
                        <div class="font-bold leading-tight">Manager</div>
                        <div class="text-[10px] text-md-on-surface-variant truncate">manager</div>
                    </div>
                </button>
            </div>
        </div>
    </div>

    <script>
        function fillCreds(user) {
            document.getElementById('usernameField').value = user;
            document.getElementById('passwordField').value = 'password123';
        }
    </script>
</body>
</html>
